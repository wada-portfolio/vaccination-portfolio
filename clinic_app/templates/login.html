<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .vac-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }

        .vac-table th,
        .vac-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        .vac-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>

<h2>医療機関向け 予防接種情報</h2>
<form method="post" action="/" class="login-form">

    <div class="form-group">
        <label for="clinic_id">ID</label>
        <input type="text" id="clinic_id" name="clinic_id" required>
    </div>

    <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">ログイン</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</body>
</html>
