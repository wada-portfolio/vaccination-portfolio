<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>予防接種情報</title>

    <style>
        .vac-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }

        .vac-table th,
        .vac-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        .vac-table th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .back-area {
            margin-top: 1.5em;
        }

        body {
        background-color: #ffffeb;
    }
    </style>
</head>

<body>

<h2>{{ user.name }} さんの予防接種ページ</h2>

<p>年齢：{{ user.age }}</p>
<p>生年月日：{{ user.birth_date.strftime("%Y年%m月%d日") }}</p>

<!-- フィルター -->
<form method="get" class="filter-form">
    <label for="filter">表示切替：</label>
    <select name="filter" id="filter" onchange="this.form.submit()">
        <option value="all" {% if filter_type == "all" %}selected{% endif %}>すべて表示</option>
        <option value="接種済み" {% if filter_type == "接種済み" %}selected{% endif %}>接種済み</option>
        <option value="接種可能" {% if filter_type == "接種可能" %}selected{% endif %}>接種可能</option>
        <option value="未接種" {% if filter_type == "未接種" %}selected{% endif %}>未接種</option>
    </select>
</form>

<!-- 接種履歴 -->
<table class="vac-table">
    <thead>
        <tr>
            <th>ワクチン名</th>
            <th>接種日</th>
            <th>接種年齢</th>
        </tr>
    </thead>

    <tbody>
    {% for r in records %}
        <tr>
            <td>{{ r.vaccine_name }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.age_at }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

<!-- 戻るボタン -->
<div class="back-area">
    <button onclick="location.href='{{ url_for('mypage') }}'">マイページに戻る</button>
</div>

</body>
</html>
